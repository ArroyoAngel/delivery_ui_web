name: delivery_ui_web QA

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: delivery-ui-web-qa
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy_qa:
    name: Deploy to Hostinger VPS (QA)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.UI_WEB_QA_PATH }}/"

      - name: Deploy on VPS
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.UI_WEB_QA_PATH }}"
          ${{ secrets.UI_WEB_QA_DEPLOY_COMMAND }}
          EOF

      - name: QA smoke check
        env:
          UI_WEB_QA_URL: ${{ secrets.UI_WEB_QA_URL }}
        run: |
          if [ -z "$UI_WEB_QA_URL" ]; then
            echo "UI_WEB_QA_URL not set. Skipping smoke check."
            exit 0
          fi
          echo "Checking $UI_WEB_QA_URL"
          curl -fSL --retry 5 --retry-delay 5 "$UI_WEB_QA_URL" > /dev/null
