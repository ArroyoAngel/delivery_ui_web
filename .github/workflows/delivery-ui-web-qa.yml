name: delivery_ui_web QA

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: delivery-ui-web-qa
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Mapea tus secrets aquí para que Next.js los vea durante el build
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Si usas el modo beta que hablamos:
          NEXT_PUBLIC_JOIN_MODE: 'beta'

  deploy_qa:
    name: Deploy to Hostinger VPS (QA)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.VPS_SSH_KEY_B64 }}" ]; then
            printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/deploy_key || {
              echo "VPS_SSH_KEY_B64 is not valid Base64."
              exit 1
            }
          else
            printf '%s' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key || {
            echo "Decoded SSH key is not an OpenSSH private key. Check VPS_SSH_KEY_B64 or VPS_SSH_KEY."
            exit 1
          }
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || {
            echo "SSH private key could not be parsed. Check VPS_SSH_KEY_B64 or VPS_SSH_KEY."
            exit 1
          }
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to VPS
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.VPS_PORT }}"
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.UI_WEB_QA_PATH }}/"

      - name: Ensure QA env file on VPS
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.VPS_PORT }}"
          if [ -n "${{ secrets.UI_WEB_QA_ENV_FILE_B64 }}" ]; then
            printf '%s' "${{ secrets.UI_WEB_QA_ENV_FILE_B64 }}" | base64 --decode | \
              ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cat > '${{ secrets.UI_WEB_QA_PATH }}/.env'"
            ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "chmod 600 '${{ secrets.UI_WEB_QA_PATH }}/.env' && cp '${{ secrets.UI_WEB_QA_PATH }}/.env' '${{ secrets.UI_WEB_QA_PATH }}/.env.local' && chmod 600 '${{ secrets.UI_WEB_QA_PATH }}/.env.local'"
          else
            ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "if [ -f '${{ secrets.UI_WEB_QA_PATH }}/.env' ]; then cp '${{ secrets.UI_WEB_QA_PATH }}/.env' '${{ secrets.UI_WEB_QA_PATH }}/.env.local'; elif [ -f '${{ secrets.UI_WEB_QA_PATH }}/.env.local' ]; then cp '${{ secrets.UI_WEB_QA_PATH }}/.env.local' '${{ secrets.UI_WEB_QA_PATH }}/.env'; else exit 1; fi; chmod 600 '${{ secrets.UI_WEB_QA_PATH }}/.env' '${{ secrets.UI_WEB_QA_PATH }}/.env.local'" || {
              echo "Missing .env/.env.local on VPS and UI_WEB_QA_ENV_FILE_B64 secret is not set."
              exit 1
            }
          fi

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.UI_WEB_QA_PATH }}"
          ${{ secrets.UI_WEB_QA_DEPLOY_COMMAND }}
          EOF

      - name: QA smoke check
        env:
          UI_WEB_QA_URL: ${{ secrets.UI_WEB_QA_URL }}
        run: |
          if [ -z "$UI_WEB_QA_URL" ]; then
            echo "UI_WEB_QA_URL not set. Skipping smoke check."
            exit 0
          fi
          echo "Checking $UI_WEB_QA_URL"
          curl -fSL --retry 5 --retry-delay 5 "$UI_WEB_QA_URL" > /dev/null
